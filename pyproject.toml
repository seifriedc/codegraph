[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "typer>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-ada>=0.1",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-python>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "setuptools>=68",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
codegraph = "codegraph.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["codegraph*"]

[tool.setuptools.package-data]
"codegraph.vis" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# B008: Typer declares options as call defaults. B905: zip strictness is noise here.
ignore = ["B008", "B905"]
