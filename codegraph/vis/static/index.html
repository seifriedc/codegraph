<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>codegraph</title>
  <style>
    :root {
      --bg: #fafafa; --panel-bg: #fff; --border: #d0d0d0; --text: #222; --muted: #777;
      --accent: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: 210px 1fr 300px;
           font: 13px system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 6px 12px;
             background: var(--panel-bg); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 14px; margin: 0 8px 0 0; }
    .spacer { flex: 1; }
    #status-section { border-top: 1px solid var(--border); padding: 8px 12px; color: var(--muted); font-size: 12px; }
    #status-section > div { padding: 1px 0; }
    #stage { min-height: 0; position: relative; }
    #cy { position: absolute; inset: 0; }
    #controls { display: flex; flex-direction: column; min-height: 0; background: var(--panel-bg); border-right: 1px solid var(--border); }
    #legend { flex: 1; overflow: auto; padding: 8px 10px; }
    #view-controls { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    #view-controls label { display: flex; flex-direction: column; gap: 2px; }
    #view-controls select { width: 100%; }
    #view-controls > div, #ov-kinds { display: flex; flex-direction: column; gap: 6px; }
    #view-controls input[type="checkbox"] { margin: 0; }
    #view-controls label.check, #ov-kinds label { flex-direction: row; align-items: center; gap: 4px; }
    #legend h3 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 8px 0 4px; }
    .legend-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; }
    .legend-row.off { opacity: 0.45; }
    .legend-kind { flex: 1; }
    .legend-count { color: var(--muted); font-variant-numeric: tabular-nums; }
    #mini-legend { position: absolute; left: 8px; bottom: 8px; max-height: 60%; overflow: auto; z-index: 5;
                   background: rgba(255,255,255,0.92); border: 1px solid var(--border); border-radius: 4px;
                   padding: 4px 8px; font-size: 12px; }
    #mini-legend:empty { display: none; }
    #mini-legend summary { cursor: pointer; color: var(--muted); }
    #mini-legend .legend-row { cursor: default; }
    #panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel-bg); border-left: 1px solid var(--border); }
    #details { flex: 1; overflow: auto; padding: 12px; }
    #details-actions { padding: 8px 12px 0; }
    #panel h2 { font-size: 15px; margin: 0 0 8px; word-break: break-all; }
    #panel h3 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
    #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
    #panel dt { color: var(--muted); } #panel dd { margin: 0; word-break: break-all; }
    #panel ul { margin: 0; padding-left: 16px; word-break: break-all; }
    #panel table { border-collapse: collapse; width: 100%; }
    #panel th, #panel td { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--border); }
    #panel td:nth-child(n+2), #panel th:nth-child(n+2) { text-align: right; }
    .muted { color: var(--muted); }
    button { cursor: pointer; }
    body[data-view="overview"] .focus-only, body:not([data-view="overview"]) .overview-only { display: none !important; }
    #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
             padding: 24px; color: var(--muted); font-size: 15px; pointer-events: none; }
    #empty[hidden] { display: none; }
    #tip { position: absolute; z-index: 10; pointer-events: none; white-space: pre; padding: 4px 8px;
           background: #222; color: #fff; border-radius: 4px; font-size: 12px; }
    .alert-wrap { position: relative; }
    .alert-btn { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--border);
                 border-radius: 4px; background: var(--panel-bg); color: var(--muted); font: inherit; }
    .alert-btn[data-severity="alert"] { color: #b45309; background: #fef3c7; border-color: #f59e0b; }
    .alert-btn[data-severity="error"] { color: #b91c1c; background: #fee2e2; border-color: #ef4444; }
    .alert-badge { font-size: 11px; min-width: 16px; text-align: center; border-radius: 8px; padding: 0 4px; background: currentColor; }
    .alert-badge { color: #fff; }
    .alert-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 340px; background: var(--panel-bg);
                 border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); padding: 4px; }
    .alert-msg { padding: 6px 8px; border-radius: 4px; margin: 2px 0; display: flex; gap: 8px; align-items: flex-start; }
    .alert-msg.alert { background: #fef3c7; } .alert-msg.error { background: #fee2e2; }
    .alert-text { flex: 1; } .alert-msg button { white-space: nowrap; }
    .alert-x { border: none; background: transparent; font-size: 16px; line-height: 1; padding: 0 4px; color: inherit; opacity: .6; }
    .alert-x:hover { opacity: 1; }
    .alert-foot { display: flex; justify-content: flex-end; padding: 4px 4px 2px; border-top: 1px solid var(--border); margin-top: 4px; }
    .search { position: relative; }
    .s-input { width: 280px; padding: 4px 8px; }
    .s-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
    .s-chip { font-size: 11px; padding: 0 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-bg); }
    .s-chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    .s-drop { position: absolute; top: 100%; left: 0; z-index: 10; width: 420px; max-height: 60vh; overflow: auto;
              background: var(--panel-bg); border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
    .s-row { padding: 4px 8px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .s-row.selected, .s-row:hover { background: #e8eefc; }
    .s-top { display: flex; gap: 6px; align-items: baseline; }
    .s-kind { font-size: 10px; text-transform: uppercase; color: var(--muted); min-width: 4.5em; }
    .s-name { font-weight: 600; flex: 1; }
    .s-lang { font-size: 10px; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--muted); }
    .s-qn, .s-path { color: var(--muted); font-size: 11px; word-break: break-all; }
    .s-note, .s-head { padding: 4px 8px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>codegraph</h1>
    <div id="search" class="search"></div>
    <label>View
      <select id="view">
        <option value="overview">overview</option>
        <option value="focus">focus</option>
        <option value="type">type hierarchy</option>
        <option value="declaration">declaration hierarchy</option>
      </select>
    </label>
    <button id="fit" type="button" title="Fit all nodes in view">Fit</button>
    <button id="undo" type="button" disabled title="Undo the last expansion">Undo expand</button>
    <button id="raise-limit" type="button" hidden title="Show more nodes (server maximum 500)"></button>
    <span class="spacer"></span>
    <div id="alerts" class="alert-wrap"></div>
  </header>
  <aside id="controls">
    <div id="legend"></div>
    <div id="view-controls">
      <div class="overview-only">
        <label>Group by
          <select id="ov-groupby" title="Directory: directories and files. Package: Ada Packages; files for C and C++">
            <option value="directory">Directory</option>
            <option value="package">Package</option>
          </select>
        </label>
        <label class="check" title="Show external placeholders as one Group"><input id="ov-externals" type="checkbox"> externals</label>
        <div id="ov-kinds" title="Edge kinds counted in Aggregate edges"></div>
      </div>
      <div class="focus-only">
        <label>Show <select id="mode"></select></label>
        <label title="Edge direction (neighborhood mode only)">Direction
          <select id="direction">
            <option value="both">both</option>
            <option value="out">out (what it points to)</option>
            <option value="in">in (what points to it)</option>
          </select>
        </label>
        <label>Depth <select id="depth"></select></label>
      </div>
    </div>
  </aside>
  <div id="stage"><div id="cy"></div><div id="empty" hidden></div><div id="mini-legend"></div><div id="tip" hidden></div></div>
  <aside id="panel">
    <div id="details-actions" class="overview-only">
      <button id="ov-focus" type="button" disabled title="Open the selected node in the focus view">Focus</button>
    </div>
    <div id="details"></div>
    <div id="status-section">
      <div id="status">Loading...</div>
      <div id="rings" class="focus-only" title="Nodes per ring (distance from the focus)"></div>
      <div id="layout-state"></div>
    </div>
  </aside>

  <!-- Vendored, pinned libraries (classic scripts: they define window.cytoscape and window.d3). -->
  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/d3-dispatch.min.js"></script>
  <script src="vendor/d3-quadtree.min.js"></script>
  <script src="vendor/d3-timer.min.js"></script>
  <script src="vendor/d3-force.min.js"></script>
  <script src="vendor/dagre.min.js"></script>
  <script src="vendor/layout-base.js"></script>
  <script src="vendor/cose-base.js"></script>
  <script src="vendor/cytoscape-fcose.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
